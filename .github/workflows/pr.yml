name: pr-check
on:
  pull_request:
    branches: [main]
permissions:
  id-token: write
  contents: read
jobs:
  whatif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID }}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az bicep build -f infra/aml.bicep
      - run: az deployment group what-if -g ${{ vars.AZURE_RG }} -f infra/aml.bicep -p suffix=${{ vars.SUFFIX }}