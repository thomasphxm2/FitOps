name: infra
on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:
permissions:
  id-token: write 
  contents: read
jobs:
  deploy:
      runs-on: ubuntu-latest
      environment: dev
      steps:
        - uses: actions/checkout@v4
        - uses: azure/login@v2
          with:
            client-id: ${{ vars.AZURE_CLIENT_ID }}
            tenant-id: ${{ vars.AZURE_TENANT_ID}}
            subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID}}
        - run: |
            az deployment group create -g ${{ vars.AZURE_RG }} \
                -f infra/aml.bicep -p suffix=${{ vars.SUFFIX }} -n aml-${{ github.run_number }}